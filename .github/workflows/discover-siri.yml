name: Discover Schleswig-Holstein SIRI ET resource

on:
  push:
    branches: [busradar-preview]
    paths:
      - ".github/workflows/discover-siri.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query Mobilithek unrestricted offer metadata
        shell: bash
        run: |
          node <<'NODE'
          const offer = "832254079439458304";
          const urls = [
            `https://mobilithek.info/mdp-api/mdp-msa-metadata/v2/offers/unrestricted/${offer}`,
            `https://mobilithek.info/mdp-api/mdp-msa-metadata/v2/offers/${offer}`,
            `https://mobilithek.info/mdp-api/mdp-msa-metadata/v2/offers/essentials/${offer}`
          ];
          for (const url of urls) {
            try {
              const res = await fetch(url, { headers: { "user-agent": "BusRadar resource discovery/0.7", accept: "application/json" } });
              const body = await res.text();
              console.log("\nENDPOINT", url, "STATUS", res.status, "TYPE", res.headers.get("content-type"), "LEN", body.length);
              console.log(body.slice(0, 30000));
              try {
                const json = JSON.parse(body);
                const walk=(value,path="root")=>{
                  if (value == null) return;
                  if (typeof value === "string") {
                    if (/https?:\/\//i.test(value) || /access|endpoint|url|siri|xml|publication|content/i.test(path+" "+value)) console.log("FIELD",path,JSON.stringify(value));
                    return;
                  }
                  if (Array.isArray(value)) return value.forEach((v,i)=>walk(v,`${path}[${i}]`));
                  if (typeof value === "object") for(const [k,v] of Object.entries(value)) walk(v,`${path}.${k}`);
                };
                walk(json);
              } catch {}
            } catch(error) {
              console.log("ERROR", url, error?.message || String(error));
            }
          }
          NODE
