name: Discover Schleswig-Holstein SIRI ET resource

on:
  push:
    branches: [busradar-preview]
    paths:
      - ".github/workflows/discover-siri.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve Mobilithek public offer
        shell: bash
        run: |
          node <<'NODE'
          const offer = "832254079439458304";
          const endpoints = [
            `https://mobilithek.info/api/offers/${offer}`,
            `https://mobilithek.info/api/v1/offers/${offer}`,
            `https://mobilithek.info/backend/offers/${offer}`,
            `https://mobilithek.info/mobilithek-api/offers/${offer}`,
            `https://mobilithek.info/offers/${offer}`
          ];
          for (const url of endpoints) {
            try {
              const res = await fetch(url, { redirect: "follow", headers: { "user-agent": "BusRadar resource discovery/0.2", accept: "application/json,text/html,*/*" } });
              const body = await res.text();
              console.log("\nENDPOINT", url, "STATUS", res.status, "FINAL", res.url, "TYPE", res.headers.get("content-type"), "LEN", body.length);
              console.log(body.slice(0, 3000).replace(/\s+/g, " "));
              const absolute = [...body.matchAll(/https?:\\?\/\\?\/[^"'<>\\s]+/g)].map(m => m[0].replaceAll("\\/", "/"));
              for (const candidate of [...new Set(absolute)].filter(x => /siri|xml|access|delfi|mobilithek|download/i.test(x)).slice(0, 50)) console.log("URLCANDIDATE", candidate);
              const scripts = [...body.matchAll(/<script[^>]+src=["']([^"']+)/gi)].map(m => new URL(m[1], res.url).href);
              for (const script of scripts.slice(-10)) {
                try {
                  const js = await (await fetch(script, { headers: { "user-agent": "BusRadar resource discovery/0.2" } })).text();
                  console.log("SCRIPT", script, "LEN", js.length);
                  const apiBits = [...js.matchAll(/https?:\\?\/\\?\/[^"'\\s]+|\/api\/[A-Za-z0-9_?&=./{}:-]+/g)].map(m => m[0].replaceAll("\\/", "/"));
                  for (const bit of [...new Set(apiBits)].filter(x => /offer|access|resource|api/i.test(x)).slice(0, 80)) console.log("APICANDIDATE", bit.slice(0, 500));
                } catch (e) { console.log("SCRIPTERR", script, e?.message || String(e)); }
              }
            } catch (error) { console.log("\nERROR", url, error?.message || String(error)); }
          }
          NODE
