name: Discover Schleswig-Holstein SIRI ET resource

on:
  push:
    branches: [busradar-preview]
    paths:
      - ".github/workflows/discover-siri.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect Mobilithek public API base
        shell: bash
        run: |
          node <<'NODE'
          const url = "https://mobilithek.info/assets/index-ChSLynr4.js";
          const res = await fetch(url, { headers: { "user-agent": "BusRadar resource discovery/0.6" } });
          const js = await res.text();
          console.log("INDEX", res.status, "LEN", js.length);
          for (const needle of ["getAPIUrl","METADATA","CONNECTION","apiUrl","metadata-service","connection-service","api-gateway","VITE_","/v2/","/v1/"]) {
            let pos = -1, count = 0;
            while ((pos = js.indexOf(needle, pos + 1)) >= 0 && count < 25) {
              console.log("CONTEXT", needle, pos, js.slice(Math.max(0,pos-1200),Math.min(js.length,pos+1800)).replace(/\s+/g," "));
              count++;
            }
          }
          const urls=[...js.matchAll(/https?:\\?\/\\?\/[^"'<>\\s)]+/g)].map(m=>m[0].replaceAll("\\/","/"));
          for(const u of [...new Set(urls)].filter(u=>/mobilithek|mdm|metadata|connection|api/i.test(u)).slice(0,200)) console.log("URL",u);
          NODE
