name: Discover Schleswig-Holstein SIRI ET resource

on:
  push:
    branches: [busradar-preview]
    paths:
      - ".github/workflows/discover-siri.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect Mobilithek public offer service
        shell: bash
        run: |
          node <<'NODE'
          for (const file of ["OfferService-CGwN8qO2.js","RequestUtils-BYX7BqyI.js"]) {
            const url = "https://mobilithek.info/assets/" + file;
            const res = await fetch(url, { headers: { "user-agent": "BusRadar resource discovery/0.5" } });
            const js = await res.text();
            console.log("\nMODULE", file, "STATUS", res.status, "LEN", js.length);
            console.log(js.slice(0, 20000).replace(/\s+/g, " "));
            const strings=[...js.matchAll(/["'`]([^"'`]{3,300})["'`]/g)].map(m=>m[1]);
            for(const s of [...new Set(strings)].filter(s=>/offer|publication|marketplace|resource|content|access|subscription|api|download/i.test(s)).slice(0,250)) console.log("STRING",s);
          }
          NODE
