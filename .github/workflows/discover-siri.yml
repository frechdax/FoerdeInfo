name: Discover Schleswig-Holstein SIRI ET resource

on:
  push:
    branches: [busradar-preview]
    paths:
      - ".github/workflows/discover-siri.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect public Mobilithek app configuration
        shell: bash
        run: |
          node <<'NODE'
          const html = await (await fetch("https://mobilithek.info/offers/832254079439458304", { headers: { "user-agent": "BusRadar resource discovery/0.3" } })).text();
          const src = html.match(/<script[^>]+src=["']([^"']+)/i)?.[1];
          if (!src) throw new Error("No app bundle found");
          const scriptUrl = new URL(src, "https://mobilithek.info").href;
          const js = await (await fetch(scriptUrl, { headers: { "user-agent": "BusRadar resource discovery/0.3" } })).text();
          console.log("BUNDLE", scriptUrl, "LEN", js.length);

          for (const needle of ["accessURL","accessUrl","accessUrls","offerId","/offers","graphql","apiUrl","baseURL","backend","resourceUrl","downloadUrl"]) {
            let at = -1;
            let count = 0;
            while ((at = js.indexOf(needle, at + 1)) >= 0 && count < 12) {
              console.log("CONTEXT", needle, at, js.slice(Math.max(0, at - 450), Math.min(js.length, at + 700)).replace(/\s+/g, " "));
              count++;
            }
          }

          const urls = [...js.matchAll(/https?:\\?\/\\?\/[^"'<>\\s)]+/g)].map(m => m[0].replaceAll("\\/", "/"));
          for (const url of [...new Set(urls)].filter(u => /mobilithek|api|offer|resource|download|siri/i.test(u)).slice(0, 200)) console.log("FULLURL", url);
          NODE
