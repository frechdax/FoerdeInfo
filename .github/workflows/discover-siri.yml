name: Discover Schleswig-Holstein SIRI ET resource

on:
  push:
    branches: [busradar-preview]
    paths:
      - ".github/workflows/discover-siri.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Mobilithek public no-auth SIRI package
        shell: bash
        run: |
          node <<'NODE'
          const publicationId = "832254079439458304";
          const urls = [
            `https://mobilithek.info/mdp-api/mdp-conn-server/v1/publication/${publicationId}/file/noauth`,
            `https://mobilithek.info/mdp-api/mdp-conn-server/v1/publication/${publicationId}/file/access`
          ];
          for (const url of urls) {
            try {
              const res = await fetch(url, { redirect:"follow", headers:{ "user-agent":"BusRadar SIRI probe/0.8", accept:"application/xml,text/xml,application/octet-stream,*/*" } });
              const buf = new Uint8Array(await res.arrayBuffer());
              console.log("\nENDPOINT", url, "STATUS", res.status, "FINAL", res.url);
              console.log("TYPE", res.headers.get("content-type"), "DISPOSITION", res.headers.get("content-disposition"), "LEN", buf.byteLength);
              const sample = new TextDecoder().decode(buf.slice(0, 4000));
              console.log("SAMPLE", sample.replace(/\s+/g," ").slice(0,4000));
            } catch(error) {
              console.log("ERROR", url, error?.message || String(error));
            }
          }
          NODE
