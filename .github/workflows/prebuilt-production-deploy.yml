name: Prebuilt production deploy
on:
  push:
    branches: [prebuilt-production-deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel token
        shell: bash
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN secret is not configured"
            exit 2
          fi
          echo "VERCEL_TOKEN secret is configured"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx vercel@latest deploy --prebuilt --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
