name: BusKarte CI

on:
  push:
    branches:
      - buskarte-preview
    paths-ignore:
      - ".github/workflows/refresh-gtfs.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Browser smoke test
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 >/tmp/buskarte-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --enable-unsafe-swiftshader --virtual-time-budget=10000 --dump-dom http://127.0.0.1:3000 >/tmp/buskarte-dom.html
          grep -q 'BusKarte' /tmp/buskarte-dom.html
          grep -q 'maplibregl-canvas' /tmp/buskarte-dom.html
          if grep -q 'BusRadar' /tmp/buskarte-dom.html; then
            echo "Old BusRadar branding still present"
            exit 1
          fi
      - name: No old BusRadar branding in source
        shell: bash
        run: |
          if grep -R -n -E 'BusRadar|busradar|BUSRADAR' --exclude-dir=.git --exclude='data/region.json' .; then
            echo "Old BusRadar branding found"
            exit 1
          fi
