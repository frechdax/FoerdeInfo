name: BusKarte CI

on:
  push:
    branches:
      - buskarte-preview
    paths-ignore:
      - ".github/workflows/refresh-gtfs.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
