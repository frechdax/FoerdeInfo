name: BusRadar Preview CI
on:
  push:
    branches: [busradar-preview]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract BusRadar source
        run: tar -xzf busradar-preview-src.tgz
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npx next build
