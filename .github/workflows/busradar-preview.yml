name: BusRadar Preview CI
on:
  push:
    branches: [busradar-preview]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild BusRadar source
        run: cat busradar-src.part* | base64 -d > /tmp/busradar.tgz && tar -xzf /tmp/busradar.tgz && node preview-patch.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Import regional GTFS
        run: node scripts/import-gtfs.mjs
      - name: Build
        run: npx next build
