name: Refresh regional GTFS

on:
  workflow_dispatch:
  push:
    branches: [buskarte-preview]
    paths:
      - "scripts/import-gtfs.mjs"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Import official NAH.SH regional GTFS
        run: npm run gtfs:import
      - name: Check realtime trip-id compatibility
        run: npm run realtime:check
      - name: Commit refreshed regional feed
        run: |
          if git diff --quiet -- data/region.json; then
            echo "No GTFS changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/region.json
          git commit -m "chore: refresh regional NAH.SH GTFS"
          git fetch origin buskarte-preview
          git rebase origin/buskarte-preview
          git push origin HEAD:buskarte-preview
