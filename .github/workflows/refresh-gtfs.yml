name: Refresh regional GTFS

on:
  workflow_dispatch:
  push:
    branches:
      - busradar-preview
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run gtfs:import
      - name: Commit refreshed regional feed
        run: |
          if git diff --quiet -- data/region.json; then
            echo "No GTFS changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/region.json
          git commit -m "chore: refresh regional GTFS"
          git push origin HEAD:busradar-preview
